[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwork-os"
version = "0.2.0"
description = "Local Python workflow and contract evaluation library with repository procedure references"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["pywinpty>=3.1.2; sys_platform == 'win32'"]
authors = [
  { name = "quamentalabs" }
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
pwos = "patchwork_os.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
patchwork_os = ["assets/*", "resources/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
