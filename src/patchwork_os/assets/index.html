<!doctype html><html lang="en"><meta charset="utf-8"><title>Patchwork OS</title><style>body{font:16px system-ui;background:#121820;color:#e4edf3;max-width:1000px;margin:2rem auto;padding:0 1rem}button,input,select,textarea{font:inherit;padding:.5rem;background:#263544;color:white;border:1px solid #708394}textarea{width:95%;height:10rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c2834;padding:1rem}section{margin:2rem 0}</style><h1>Patchwork OS</h1><p>Local processes; execution success does not imply native acceptance.</p><section><h2>Configured runtimes</h2><pre id="config"></pre></section><section><h2>Submit</h2><label>Runtime <select id="runtime"><option>cc</option><option>codex</option><option>agy</option><option>muse</option></select></label> <label>Mode <select id="mode"><option>task</option><option>terminal</option></select></label> <input id="model" placeholder="Model (optional)"><input id="effort" placeholder="Effort (optional)"><p><textarea id="prompt" placeholder="Task or native input"></textarea></p><button id="submit">Submit</button></section><section><h2>Runs</h2><button id="refresh">Refresh</button><pre id="runs"></pre><input id="runid" placeholder="Run ID"><button id="collect">Collect output</button><button id="close">Close</button><p><input id="terminalInput" placeholder="Terminal input"><button id="sendInput">Send input</button></p><pre id="output"></pre></section><script>const token='__TOKEN__';async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'X-PWOS-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let x=await r.json();if(!r.ok)throw Error(JSON.stringify(x));return x}function show(id,x){document.getElementById(id).textContent=JSON.stringify(x,null,2)}async function refresh(){try{show('config',await api('/api/config'));show('runs',await api('/api/runs'))}catch(e){show('output',String(e))}}document.getElementById('refresh').onclick=refresh;document.getElementById('submit').onclick=async()=>{try{let x=await api('/api/run',{runtime:runtime.value,mode:mode.value,prompt:document.getElementById("prompt").value+(mode.value==='terminal'?'\r':''),model:model.value||null,effort:effort.value||null,submission_id:crypto.randomUUID()});runid.value=x.run_id;show('output',x);refresh()}catch(e){show('output',String(e))}};document.getElementById('collect').onclick=async()=>{try{show('output',await api('/api/collect/'+encodeURIComponent(runid.value)))}catch(e){show('output',String(e))}};document.getElementById('sendInput').onclick=async()=>{try{show('output',await api('/api/input',{run_id:runid.value,text:terminalInput.value+'\r'}));terminalInput.value=''}catch(e){show('output',String(e))}};document.getElementById('close').onclick=async()=>{try{show('output',await api('/api/close',{run_id:runid.value}));refresh()}catch(e){show('output',String(e))}};refresh()</script></html>
